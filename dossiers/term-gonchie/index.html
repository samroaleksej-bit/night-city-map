function isLocked(x,t){if(!A())return false;const fl=t==='msgs'?A().msgsFloor:x.floor;return fl!=null&&!fDone(fl)}
function visible(i){return NS.map||i<=NS.pos||fDone(i)}
function d10(){let r=1+Math.floor(Math.random()*10),note='';if(r===10){const e=1+Math.floor(Math.random()*10);r+=e;note=NL.crit+' +'+e}else if(r===1){const e=1+Math.floor(Math.random()*10);r-=e;note=NL.fumble+' −'+e}return[r,note]}

function netList(){const box=$('#items');box.innerHTML='';$('#lh').textContent='// '+NL.arch;
  A().floors.forEach((f,i)=>{const T=TYPES[f.type]||TYPES.empty,v=visible(i),d=document.createElement('div');
    let st=fDone(i)?(f.type==='ice'?(NS.done[i]==='slid'?NL.slid:NL.iced):NL.done):(i===NS.pos&&f.type==='ice'?NL.icea:'');
    d.className='it on fl'+(i===NS.pos?' here':'')+(fDone(i)?' ok':'')+(f.type==='ice'&&v&&!fDone(i)?' ice':'')+(i===fsel?' sel':'');
    d.innerHTML=`<div class="t"><span class="ic">${v?T.ic:'?'}</span>${NL.floor} ${i+1} · ${v?(f.name||T.n):NL.unk}</div><div class="m"><span>${v&&f.dv?'DV '+f.dv:''}${i===NS.pos?' · '+NL.here:''}</span><span>${st}</span></div>`;
    d.onclick=()=>{S.open();fsel=i;netList();netPane()};d.onmouseenter=()=>S.hover();box.appendChild(d)});
}
function netPane(){const a=A(),f=a.floors[fsel],T=TYPES[f.type]||TYPES.empty,v=visible(fsel),iv=ifc();
  $('#ph').innerHTML=`<div class="t">${NL.arch} · ${a.tier||''} · DV ${a.dv}</div><div class="m">${NL.floor}: <b>${a.floors.length}</b> · ${NL.iface}: <b><input id="ifc" type="number" min="1" max="10" value="${iv}"></b> · ${NL.acts}: <b id="acts">${actsFor(iv)}</b> · <b>${NS.pos<0?NL.out:NL.floor+' '+(NS.pos+1)}</b></div>`;
  $('#ifc').onchange=e=>{try{localStorage.setItem('ncm-iface',e.target.value)}catch(_){}$('#acts').textContent=actsFor(Number(e.target.value))};
  const pb=$('#pb');
  let h=`<div class="nbar">${NS.pos<0?`<button data-n="jin">${NL.jin}</button>`:`<button data-n="jout">${NL.jout}</button>`}
    <button data-n="path" ${NS.pos<0||NS.map?'disabled':''}>${NL.path} · DV ${a.dv}</button>
    ${NS.pos>=0&&NS.pos<a.floors.length-1&&!(TYPES[a.floors[NS.pos].type]?.block&&!fDone(NS.pos))?`<button data-n="down" class="hot">${NL.down}</button>`:''}
    <button data-n="reset" class="dim">${NL.reset}</button></div>`;
  h+=`<div class="fcard${f.type==='ice'&&v?' ice':''}"><div class="fh"><span class="big">${v?T.ic+' '+(f.name||T.n):NL.floor+' '+(fsel+1)+' · '+NL.unk}</span>${v&&f.dv?`<span class="dv">DV ${f.dv}</span>`:''}</div>`;
  if(v){if(f.desc)h+=`<div class="ln">${f.desc}</div>`;
    if(f.type==='ice')h+=`<div class="ice-st">${['PER','SPD','ATK','DEF','REZ'].map(k=>`<div><small>${k}</small><b>${f[k.toLowerCase()]??'—'}</b></div>`).join('')}</div><div class="ln y">${f.effect||''}</div>`;
    if(T.r)h+=`<div class="ln d">${T.r}</div>`;
    const here=fsel===NS.pos,can=here&&!fDone(fsel);
    if(can&&T.act)h+=`<div class="rollr"><button data-n="act" class="hot">${T.act} · ${NL.roll}</button><span class="d">${NL.own}</span><input id="own" type="number"><button data-n="own">OK</button></div>`;
    if(can&&f.type==='ice')h+=`<div class="rollr"><button data-n="derez" class="hot">${NL.derez}</button><button data-n="slide">${NL.slide} · ${NL.roll}</button><span class="d">vs PER ${f.per??'?'} + 1d10</span></div>`;
    if(fDone(fsel)&&f.reveal)h+=`<div class="ln c">${f.reveal}</div>`;
  }
  h+=`</div><div id="rres"></div><div class="nlog"><div class="d">${NL.log}</div>${NS.log.slice(-7).map(l=>`<div>${l}</div>`).join('')}</div>`;
  pb.innerHTML=h;
  pb.querySelectorAll('button[data-n]').forEach(b=>{b.onmouseenter=()=>S.hover();b.onclick=()=>netAct(b.dataset.n)});
}
function showRoll(label,r,note,dv,ok){$('#rres').innerHTML=`<div class="rres ${ok?'okk':'bad'}"><span>${label}: ${NL.iface} ${ifc()} + d10 ${note?`<em>(${note})</em>`:''} = <b>${r}</b> vs ${dv}</span><b class="v">${ok?NL.ok:NL.fail}</b></div>`;
  if(ok)S.unlocked();else S.tone(180,.3,{type:'sawtooth',vol:.08,f2:90})}
async function netAct(n){const a=A(),f=a.floors[fsel],T=TYPES[f.type]||TYPES.empty;S.open();
  if(n==='jin'){NS.pos=0;logN(`▶ ${NL.jin}`);S.granted();fsel=0}
  if(n==='jout'){const hot=f&&NS.pos>=0&&a.floors[NS.pos].type==='ice'&&!fDone(NS.pos);logN(`◀ ${NL.jout}${hot?' — '+a.floors[NS.pos].name+': '+(a.floors[NS.pos].effect||''):''}`);NS.pos=-1;if(hot)S.alarm();else S.tab()}
  if(n==='down'){NS.pos++;fsel=NS.pos;const nf=a.floors[NS.pos];logN(`▼ ${NL.floor} ${NS.pos+1}: ${nf.name||TYPES[nf.type].n}`);if(nf.type==='ice'){S.alarm();S.glitch()}else S.tab()}
  if(n==='reset'){NS={pos:-1,done:{},map:false,log:[]};fsel=0}
  if(n==='path'){const [d,note]=d10(),r=ifc()+d,ok=r>=a.dv;showRoll('PATHFINDER',r,note,a.dv,ok);if(ok)NS.map=true;logN(`PATHFINDER ${r} vs ${a.dv} — ${ok?NL.ok:NL.fail}`);nsSave();netList();setTimeout(netPane,1600);return}
  if(n==='act'||n==='own'){let r,note='';if(n==='own'){r=Number($('#own').value);if(!r&&r!==0)return}else{const [d,nt]=d10();r=ifc()+d;note=nt}
    const ok=r>=f.dv;showRoll(T.act,r,note,f.dv,ok);logN(`${NL.floor} ${fsel+1} · ${T.act} ${r} vs ${f.dv} — ${ok?NL.ok:NL.fail}`);if(ok)NS.done[fsel]=1;nsSave();netList();setTimeout(netPane,1600);updLocks();return}
  if(n==='slide'){const [d,note]=d10(),r=ifc()+d,ip=1+Math.floor(Math.random()*10),dv=(f.per||0)+ip,ok=r>dv;showRoll('SLIDE',r,note,`PER ${f.per}+${ip} = ${dv}`,ok);logN(`SLIDE ${r} vs ${dv} — ${ok?NL.ok:NL.fail}`);if(ok)NS.done[fsel]='slid';nsSave();netList();setTimeout(netPane,1600);return}
  if(n==='derez'){NS.done[fsel]=1;logN(`☠ ${f.name} — ${NL.iced}`);S.glitch()}
  nsSave();netList();netPane();updLocks();
}
function updLocks(){} // списки файлов/сообщений перерисуются при переключении вкладки
setInterval(()=>{if(!D||!A())return;const s=nsLoad(),j=JSON.stringify(s);if(j!==nsJSON&&j!==JSON.stringify(NS)){NS=s;nsJSON=j;if(cur==='net'){netList();if(!document.activeElement||document.activeElement.tagName!=='INPUT')netPane()}}},800);

start();
</script></body></html>
