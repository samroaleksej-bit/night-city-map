<style>
/* Layout: a Night City terminal file browser — path bar, folder tree on the left, the open folder on the right; folders open with a glitch */
:root{
  --bg:#07080b; --win:#0f1117; --panel:#151821; --line:#2a2f3b; --fg:#e8eef2; --muted:#8c96a3;
  --red:#ff2f4b; --cyan:#3ee6ff; --yel:#f5d90a; --ok:#7fe08a;
  --head:"Oswald","Arial Narrow",sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace; --hand:"Caveat",cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font:15px/1.55 var(--body);background:radial-gradient(ellipse at 30% 0%,#122030 0%,var(--bg) 60%) fixed var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.term{border:1px solid var(--line);background:var(--win);box-shadow:0 0 0 1px #000,0 20px 60px rgba(0,0,0,.6),0 0 40px rgba(62,230,255,.06)}
.tbar{display:flex;align-items:center;gap:12px;padding:8px 12px;background:#0a0c11;border-bottom:1px solid var(--line);font:600 12px var(--mono);letter-spacing:.08em;color:var(--muted)}
.tbar .dots{display:flex;gap:6px}.tbar .dots i{width:10px;height:10px;display:block;border:1px solid var(--line)}
.tbar .dots i:first-child{background:var(--red);border-color:var(--red)}
.tbar b{color:var(--cyan);font-weight:600}
.tbar .rt{margin-left:auto;color:var(--red)}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:8px 12px;border-bottom:1px solid var(--line);font:500 13px var(--mono);color:var(--muted);background:#0c0e14}
.path button{all:unset;cursor:pointer;color:var(--cyan);padding:1px 4px}
.path button:hover,.path button:focus-visible{background:rgba(62,230,255,.12);outline:none}
.path .cur{color:var(--fg);padding:1px 4px}
.path .back{margin-right:8px;border:1px solid var(--line);padding:2px 10px;color:var(--fg)}
.body{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:640px}
@media (max-width:820px){.body{grid-template-columns:minmax(0,1fr)}.tree{display:none}}
.tree{border-right:1px solid var(--line);padding:12px 0;font:500 13px var(--mono);background:#0b0d12}
.tree button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;width:100%;padding:5px 14px;cursor:pointer;color:var(--muted)}
.tree button:hover,.tree button:focus-visible{color:var(--fg);background:rgba(255,255,255,.04)}
.tree button.on{color:var(--yel);background:rgba(245,217,10,.07);border-left:2px solid var(--yel)}
.tree .ico{width:16px;height:12px;flex:none;position:relative;background:currentColor;opacity:.85}
.tree .ico::before{content:"";position:absolute;left:0;top:-3px;width:7px;height:3px;background:currentColor}
.tree .ico.f{width:12px;height:14px;opacity:.7}.tree .ico.f::before{display:none}
.tree .root{color:var(--fg);font-weight:600;margin-bottom:4px}
.pane{padding:20px;min-width:0;position:relative}
.pane.opening{animation:open .42s steps(5) both}
@keyframes open{0%{clip-path:inset(0 0 100% 0);filter:brightness(2.4) hue-rotate(70deg);transform:translateX(-6px)}40%{clip-path:inset(0 0 45% 0);transform:translateX(4px)}70%{clip-path:inset(0 0 10% 0);filter:brightness(1.4)}100%{clip-path:inset(0);filter:none;transform:none}}
/* рабочий стол: папки */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 14px}
.fold{all:unset;box-sizing:border-box;cursor:pointer;display:grid;justify-items:center;gap:8px;padding:12px 6px;text-align:center;border:1px solid transparent}
.fold:hover,.fold:focus-visible{border-color:rgba(62,230,255,.35);background:rgba(62,230,255,.05);outline:none}
.fico{position:relative;width:96px;height:70px;--c:var(--yel)}
.fico::before{content:"";position:absolute;left:0;top:0;width:40px;height:12px;background:color-mix(in srgb,var(--c) 70%,#000);clip-path:polygon(0 0,80% 0,100% 100%,0 100%)}
.fico .back{position:absolute;left:0;right:0;top:8px;bottom:0;background:color-mix(in srgb,var(--c) 70%,#000)}
.fico .paper{position:absolute;left:10px;right:10px;top:12px;height:40px;background:#e9e4d8;transition:transform .2s}
.fico .front{position:absolute;left:0;right:0;top:20px;bottom:0;background:var(--c);transform-origin:bottom;transition:transform .25s;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.fico .front::after{content:attr(data-n);position:absolute;right:8px;bottom:6px;font:700 13px var(--mono);color:rgba(0,0,0,.55)}
.fold:hover .front,.fold:focus-visible .front{transform:perspective(200px) rotateX(-28deg)}
.fold:hover .paper,.fold:focus-visible .paper{transform:translateY(-8px)}
.fold.red .fico{--c:var(--red)}.fold.cy .fico{--c:var(--cyan)}
.fold b{font:600 13px var(--mono);letter-spacing:.04em;color:var(--fg);word-break:break-word}
.fold small{font:400 12px var(--mono);color:var(--muted)}
.fold.locked b::after{content:" 🔒";}
/* файлы */
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
figure{margin:0;min-width:0}
.file{background:var(--panel);border:1px solid var(--line)}
.file img{display:block;width:100%;height:auto;cursor:zoom-in;background:#000}
.file figcaption{padding:10px 12px;font:400 13px/1.45 var(--mono);color:var(--muted)}

h2{font:700 26px var(--head);text-transform:uppercase;letter-spacing:.05em;margin:0 0 4px}
.sub{font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 16px}
.profile{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:700px){.profile{grid-template-columns:minmax(0,1fr)}}
.data{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0}
.data dt{font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.data dd{margin:0;font-weight:600}.data dd em{font-style:normal;color:var(--cyan)}
.list{margin:16px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.list li{padding:8px 12px;background:var(--panel);border-left:3px solid var(--red);font-size:14px}
.facts{margin:0;padding:0;list-style:none;display:grid;gap:8px;max-width:70ch}
.facts li{font-size:14px;padding-left:14px;border-left:2px solid var(--line)}
.facts li b{color:var(--red);font-family:var(--mono);margin-right:6px}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.split{grid-template-columns:minmax(0,1fr)}}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.skills div{background:var(--panel);padding:12px;border-top:2px solid var(--cyan);font-size:14px}
.skills b{display:block;font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--cyan);margin-bottom:2px}
.enemy figcaption .tag{display:block;font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
.enemy figcaption h3{font:700 18px var(--head);text-transform:uppercase;margin:2px 0 6px;color:var(--fg)}

.txtfile{background:#14110a;border:1px solid #4d4224;padding:22px 26px;max-width:62ch;font:600 28px/1.3 var(--hand);color:#ffd36b;transform:rotate(-.5deg)}
.txtfile small{display:block;font:400 13px var(--mono);color:#a8955f;margin-top:10px}
.denied{font:600 14px var(--mono);color:var(--red);border:1px solid var(--red);padding:14px 16px;max-width:60ch;background:rgba(255,47,75,.06)}

.stamp{display:inline-block;font:700 18px var(--head);color:var(--red);border:3px solid var(--red);padding:0 10px;transform:rotate(-5deg);letter-spacing:.12em;margin-left:10px;vertical-align:middle}
h1{font:700 clamp(30px,5vw,46px)/1 var(--head);text-transform:uppercase;margin:0 0 4px;display:inline-block;text-shadow:2px 0 rgba(255,47,75,.75),-2px 0 rgba(62,230,255,.75)}
.status{display:flex;flex-wrap:wrap;gap:6px 18px;padding:7px 12px;border-top:1px solid var(--line);font:500 12px var(--mono);color:var(--muted);background:#0a0c11}
.status b{color:var(--ok);font-weight:500}
.status span:last-child::after{content:"█";margin-left:6px;color:var(--cyan);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
/* экран */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:15;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 50%,transparent 60%,rgba(0,0,0,.55) 100%);animation:flick 6s steps(1) infinite}
body::before{content:"";position:fixed;left:0;right:0;height:120px;top:-140px;pointer-events:none;z-index:16;background:linear-gradient(180deg,transparent,rgba(62,230,255,.07),transparent);animation:sweep 7s linear infinite}
@keyframes flick{0%,100%{opacity:1}31%{opacity:.85}32%{opacity:1}74%{opacity:.9}75%{opacity:1}}
@keyframes sweep{to{top:110vh}}
.gl{animation:imgl .38s steps(2) 1}
@keyframes imgl{20%{transform:translate(-6px,2px);filter:hue-rotate(80deg) saturate(2.2) contrast(1.4);clip-path:inset(12% 0 55% 0)}40%{transform:translate(5px,-2px);filter:invert(.12) hue-rotate(-60deg);clip-path:inset(48% 0 18% 0)}60%{transform:translate(-3px,0);filter:brightness(1.6) saturate(0);clip-path:inset(0 0 70% 0)}80%{transform:translate(2px,1px);clip-path:inset(70% 0 0 0)}}
#boot{position:fixed;inset:0;z-index:30;background:#030405;color:var(--cyan);font:500 15px/1.7 var(--mono);display:grid;place-content:center;padding:0 16px;cursor:pointer;transition:opacity .35s}

.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:16px;z-index:20;cursor:zoom-out}

.lbx{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));font:600 14px var(--mono);background:#000;color:#fff;border:1px solid #555;padding:6px 12px;cursor:pointer;z-index:21}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}#boot{display:none}}
</style>

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const GL = "█▓▒░#@%&*/\\<>01GRIMЖФЩЯ";
function scramble(el, final, ms){ if(reduce){el.textContent=final;return} const t0=performance.now(); const step=t=>{const k=Math.min(1,(t-t0)/ms),n=Math.floor(final.length*k); el.textContent=final.slice(0,n)+Array.from(final.slice(n),()=>GL[Math.floor(Math.random()*GL.length)]).join(""); if(k<1)requestAnimationFrame(step)}; requestAnimationFrame(step); }
function folderIcon(f){ return f.file ? `<span class="fico" style="--c:#cfd6dc"><span class="back" style="background:#e9e4d8"></span></span>` : `<span class="fico"><span class="back"></span><span class="paper"></span><span class="front" data-n="${f.n}"></span></span>`; }
function render(){
  tree.innerHTML = `<button class="root ${cur?"":"on"}" data-go=""><span class="ico"></span>GRIM/</button>` + ORDER.map(k=>{const f=F[k];return `<button class="${cur===k?"on":""}" data-go="${k}" style="padding-left:30px"><span class="ico ${f.file?"f":""}"></span>${f.name}</button>`}).join("");
  path.innerHTML = (cur?`<button class="back" data-go="">← Назад</button>`:"") + ROOT.map((p,i)=> i<ROOT.length-1 ? `<span>${p}</span> /` : (cur?`<button data-go="">${p}</button> /`:`<span class="cur">${p}</span>`)).join(" ") + (cur?` <span class="cur">${F[cur].name}</span>`:"");
  if(!cur){
    pane.innerHTML = `<h2>Досье № 4 · GRIM</h2><p class="sub">${ORDER.length} объектов · открой папку</p><div class="grid">${ORDER.map(k=>{const f=F[k];return `<button class="fold ${f.cls}${f.locked?" locked":""}" data-go="${k}">${folderIcon(f)}<b>${f.name}</b><small>${f.note}</small></button>`}).join("")}</div>`;
  } else {
    pane.innerHTML = F[cur].html;
    const d = pane.querySelector(".dec"); if(d) scramble(d, d.dataset.final, 800);
  }
  document.getElementById("cnt").textContent = cur ? `Открыто: ${F[cur].name}` : "Готов";
  pane.classList.remove("opening"); void pane.offsetWidth; if(!reduce) pane.classList.add("opening");
}
function go(k){ cur = k || null; render(); try{ history.replaceState(null,"",k?"#"+k:location.pathname) }catch(e){} pane.focus?.({preventScroll:true}); }
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if(g){ go(g.dataset.go); return; }
  const im = e.target.closest(".pane img"); if(!im) return;
  const lb = document.createElement("div"); lb.className="lb"; lb.setAttribute("role","dialog"); lb.setAttribute("aria-label",im.alt);
  lb.innerHTML = `<img src="${im.getAttribute("src")}" alt="${im.alt}"><button class="lbx" type="button">Закрыть ✕</button>`;
  const close=()=>{lb.remove();document.removeEventListener("keydown",kd)}; const kd=ev=>{if(ev.key==="Escape")close()};
  lb.addEventListener("click",close); document.addEventListener("keydown",kd); document.body.appendChild(lb); lb.querySelector("button").focus();
});
document.addEventListener("keydown", e => { if(e.key==="Backspace" && cur && !e.target.closest("input,textarea")) { e.preventDefault(); go(""); } });
const start = (location.hash||"").slice(1); cur = F[start] ? start : null; render();

// загрузка с терминала
(function(){
  const boot = document.getElementById("boot");
  if (reduce) { boot.remove(); return; }
  const done = () => { boot.classList.add("off"); setTimeout(()=>boot.remove(),400); };
  const lines = [["NCNET://danger-gal/secure · защищённое соединение…",""],["АВТОРИЗАЦИЯ: фиксер · допуск 4","ok"],["ДЕШИФРОВКА АРХИВА · ДОСЬЕ № 4","bar"],["ВНИМАНИЕ: сеанс записывается","r"]];
  let i = 0; const next = () => { if(!boot.isConnected) return; if(i>=lines.length) return setTimeout(done,350);
    const [txt,cls] = lines[i++]; const p=document.createElement("p"); if(cls && cls!=="bar") p.className=cls; boot.appendChild(p);
    if(cls==="bar"){ p.textContent=txt; const b=document.createElement("span"); b.className="bar2"; b.innerHTML="<i></i>"; boot.appendChild(b); requestAnimationFrame(()=>{b.firstChild.style.transition="width .7s steps(12)"; b.firstChild.style.width="100%"}); return setTimeout(next,800); }
    scramble(p,"> "+txt,320); setTimeout(next,380); };
  boot.addEventListener("click",done); next(); setTimeout(()=>boot.isConnected&&done(),4500);
  setInterval(()=>{ if(document.hidden) return; const pool=[...document.querySelectorAll(".pane img, .pane .fico, .pane .file")]; const el=pool[Math.floor(Math.random()*pool.length)]; if(!el) return;
    el.classList.remove("gl"); void el.offsetWidth; el.classList.add("gl"); setTimeout(()=>el.classList.remove("gl"),420); }, 2600);
})();
</script>

</body></html>
